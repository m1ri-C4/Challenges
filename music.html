<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musica</title>
</head>
<body>
    <h1> <span style="color: green;">MusicStreaming!</span> </h1>
    <h3> Welcome to MusicStreaming!</h3>
    <p> <span style="color: blue;">Sign up for more information!</span> </p>
    <form onsubmit="alert('Registration submitted!')">
        <div>
        <input type="text" placeholder="Enter your name"/>   
        </div>
        <div>
        <input type="text" placeholder="Enter your surname" />    
        </div>
        <div>
        <input type="email" placeholder="Enter your email address"/>
        </div>
        <div>
        <input type="password" placeholder="Enter your password"/>    
        </div>
        <div>
        <input type="date" placeholder="Enter your date of birth"/>
        </div>
        <div>
        <input type="number" placeholder="Enter your number"/>
        </div>
        <div>
            <input type="checkbox" name="genres" value="Punk"/>
        Punk
        </div>
        <div>
            <input type="checkbox" name="genres" value="Rock"/>
            Rock
        </div>
        <div>
            <input type="checkbox" name="genres" value="Jazz"/>
            Jazz
        </div>
        <div>
            <input type="checkbox" name="genres" value="Classical"/>
            Classical
        </div>
        <div>
            <input type="checkbox" name="genres" value="Rap"/>
            Rap
        </div>
        <div>
            <input type="checkbox" name="genres" value="Hip Hop"/>
            Hip Hop
        </div>
        <div>
            <input type="checkbox" name="genres" value="Metal"/>
            Metal
        </div>

        <div>
        <input type="radio" name="terms" value="accept"/>
        I accept the terms and conditions
        </div>
        <div>
            <input type="radio" name="terms" value="decline"/>
            I decline the terms and conditions
        </div>
    <button type="submit">Submit registration</button>
    </form>
</body>
</html>
